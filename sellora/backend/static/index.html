<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sellora — Your Product. Their Audience. More Sales.</title><meta name="description" content="Sellora connects e-commerce sellers with creators who promote products and earn from confirmed sales."><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.grad{background:linear-gradient(135deg,#0f172a,#4338ca 55%,#7c3aed)}.shadow-soft{box-shadow:0 20px 60px rgba(15,23,42,.08)}.glass{background:rgba(255,255,255,.1);backdrop-filter:blur(16px)}</style></head><body class="bg-slate-50 text-slate-900"><div id="root"></div><script type="text/babel">
const{useState,useEffect}=React;async function api(p,o={}){let t=localStorage.getItem("sellora_token"),h={"Content-Type":"application/json",...(o.headers||{})};if(t)h.Authorization="Bearer "+t;let r=await fetch(p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Request failed");return d}const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function App(){let[page,setPage]=useState(location.pathname==="/"?"home":location.pathname.slice(1)||"home"),[user,setUser]=useState(null),[busy,setBusy]=useState(true);useEffect(()=>{api("/api/me").then(x=>{setUser(x.user);setPage("dashboard")}).catch(()=>{}).finally(()=>setBusy(false))},[]);let nav=p=>{history.pushState({},'',p==="home"?"/":"/"+p);setPage(p)};if(busy)return <div className="min-h-screen grid place-items-center font-black text-2xl">SELLORA</div>;return <><Header user={user} nav={nav}/>{page==="home"&&<Home nav={nav}/>} {page==="marketplace"&&<Marketplace user={user} nav={nav}/>} {page==="login"&&<Auth login setUser={setUser} nav={nav}/>} {page==="signup"&&<Auth setUser={setUser} nav={nav}/>} {page==="dashboard"&&user&&<Dashboard user={user} nav={nav}/>} {page==="sellers"&&<RolePage role="seller" nav={nav}/>} {page==="creators"&&<RolePage role="creator" nav={nav}/>}</>}
function Header({user,nav}){return <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b"><div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"><button onClick={()=>nav("home")} className="font-black text-2xl">Sell<span className="text-indigo-600">ora</span></button><nav className="hidden md:flex gap-7 text-sm font-semibold"><button onClick={()=>nav("marketplace")}>Explore Products</button><button onClick={()=>nav("sellers")}>For Sellers</button><button onClick={()=>nav("creators")}>For Creators</button></nav><div>{user?<button onClick={()=>nav("dashboard")} className="bg-slate-900 text-white px-4 py-2 rounded-xl">Dashboard</button>:<><button onClick={()=>nav("login")} className="px-4 py-2">Login</button><button onClick={()=>nav("signup")} className="bg-indigo-600 text-white px-4 py-2 rounded-xl">Get Started</button></>}</div></div></header>}
function Home({nav}){return <main><section className="grad text-white"><div className="max-w-7xl mx-auto px-4 py-24 md:py-32 grid md:grid-cols-2 gap-12 items-center"><div><span className="inline-block px-3 py-1 rounded-full glass text-sm">Performance marketplace for modern commerce</span><h1 className="text-5xl md:text-7xl font-black leading-none mt-5">Your Product.<br/>Their Audience.<br/><span className="text-violet-200">More Sales.</span></h1><p className="mt-7 text-lg text-slate-200 max-w-xl">Sellora connects e-commerce sellers with creators who can promote their products and earn from every confirmed sale.</p><div className="mt-8 flex gap-3"><button onClick={()=>nav("signup")} className="bg-white text-slate-900 px-6 py-3 rounded-2xl font-bold">Start Selling</button><button onClick={()=>nav("signup")} className="border border-white/30 px-6 py-3 rounded-2xl font-bold">Become a Creator</button></div></div><div className="glass rounded-3xl p-5 shadow-2xl"><div className="bg-white text-slate-900 rounded-2xl p-5"><div className="h-52 rounded-2xl bg-gradient-to-br from-indigo-100 to-violet-100 grid place-items-center text-6xl">🎧</div><h3 className="text-xl font-bold mt-4">Creator Studio Headphones</h3><div className="flex justify-between mt-2"><span>{money(2999)}</span><b className="text-indigo-600">20% commission</b></div><div className="grid grid-cols-3 mt-5 text-center"><M n="12.4K" l="Clicks"/><M n="284" l="Sales"/><M n="₹1.7L" l="Earned"/></div></div></div></div></section><section className="max-w-7xl mx-auto px-4 py-20"><p className="text-indigo-600 font-bold text-center">HOW SELLORA WORKS</p><h2 className="text-4xl font-black text-center mt-2">One loop. Two winners.</h2><div className="grid md:grid-cols-3 gap-6 mt-10">{[["01","List","Sellers add products, stock and commission."],["02","Promote","Creators discover offers and generate trackable links."],["03","Grow","Confirmed orders become approved creator earnings."]].map(x=><div className="p-7 rounded-3xl bg-white border shadow-soft" key={x[0]}><b className="text-indigo-600">{x[0]}</b><h3 className="text-2xl font-bold mt-3">{x[1]}</h3><p className="text-slate-500 mt-2">{x[2]}</p></div>)}</div></section><section className="bg-white border-y"><div className="max-w-7xl mx-auto px-4 py-20 grid md:grid-cols-2 gap-8"><Info t="For Sellers" a={["Performance-based acquisition","Commission controls per product","Conversion and sales analytics","Campaign-ready affiliate links"]}/><Info t="For Creators" a={["Search by commission and category","One-click affiliate links","Pending vs approved earnings","Wallet and payout tracking"]}/></div></section></main>}
function M({n,l}){return <div><b>{n}</b><div className="text-xs text-slate-400">{l}</div></div>}function Info({t,a}){return <div className="rounded-3xl p-8 bg-slate-50"><h3 className="text-3xl font-black">{t}</h3>{a.map(x=><div className="mt-4" key={x}>✓ {x}</div>)}</div>}
function Auth({login,setUser,nav}){let[role,setRole]=useState("creator"),[f,setF]=useState({name:"",email:"",password:""});async function go(e){e.preventDefault();try{let d=await api("/api/auth/"+(login?"login":"signup"),{method:"POST",body:JSON.stringify(login?{email:f.email,password:f.password}:{...f,role})});localStorage.setItem("sellora_token",d.token);setUser(d.user);nav("dashboard")}catch(e){alert(e.message)}}return <main className="min-h-[80vh] grid place-items-center px-4"><form onSubmit={go} className="w-full max-w-md bg-white p-8 rounded-3xl border shadow-soft"><h1 className="text-3xl font-black">{login?"Welcome back":"Join Sellora"}</h1>{!login&&<><div className="grid grid-cols-2 gap-2 mt-6">{["creator","seller"].map(r=><button type="button" onClick={()=>setRole(r)} className={"p-3 rounded-xl border "+(role===r?"border-indigo-600 bg-indigo-50":"")} key={r}>{r}</button>)}</div><Input l="Name" v={f.name} c={v=>setF({...f,name:v})}/></>}<Input l="Email" v={f.email} c={v=>setF({...f,email:v})}/><Input l="Password" type="password" v={f.password} c={v=>setF({...f,password:v})}/><button className="w-full mt-5 bg-indigo-600 text-white p-3 rounded-xl font-bold">{login?"Login":"Create account"}</button><button type="button" onClick={()=>nav(login?"signup":"login")} className="w-full mt-3 text-indigo-600 text-sm">{login?"Create an account":"Already registered? Login"}</button></form></main>}
function Input({l,v,c,type="text"}){return <label className="block mt-5 text-sm font-semibold">{l}<input required type={type} value={v} onChange={e=>c(e.target.value)} className="mt-2 w-full border rounded-xl p-3"/></label>}
function RolePage({role,nav}){return <main className="max-w-7xl mx-auto px-4 py-24"><span className="text-indigo-600 font-bold">SELLORA {role.toUpperCase()}S</span><h1 className="text-5xl font-black max-w-3xl mt-3">{role==="seller"?"Turn products into measurable acquisition.":"Turn audience trust into measurable earnings."}</h1><p className="text-lg text-slate-500 max-w-2xl mt-5">{role==="seller"?"List offers, set commission, recruit creators and see what converts.":"Discover products, create trackable links and build a transparent commission pipeline."}</p><button onClick={()=>nav("signup")} className="mt-8 bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold">Create {role} account</button></main>}
function Marketplace({user,nav}){let[items,setItems]=useState([]),[q,setQ]=useState(""),[sort,setSort]=useState("newest");let load=()=>api("/api/products?search="+encodeURIComponent(q)+"&sort="+sort).then(setItems).catch(e=>alert(e.message));useEffect(load,[sort]);async function link(id){if(!user)return nav("login");try{let x=await api("/api/affiliate/"+id,{method:"POST"});navigator.clipboard?.writeText(x.url);alert("Affiliate link copied:\n"+x.url)}catch(e){alert(e.message)}}return <main className="max-w-7xl mx-auto px-4 py-12"><div className="flex flex-col md:flex-row md:items-end justify-between gap-4"><div><b className="text-indigo-600">MARKETPLACE</b><h1 className="text-4xl font-black mt-1">Find products worth promoting.</h1></div><div className="flex gap-2"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&load()} placeholder="Search…" className="border rounded-xl px-4 py-3"/><select value={sort} onChange={e=>setSort(e.target.value)} className="border rounded-xl px-3"><option value="newest">Newest</option><option value="commission">Highest commission</option><option value="popularity">Popularity</option></select></div></div><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-10">{items.map(p=><div className="bg-white border rounded-3xl overflow-hidden shadow-soft" key={p.id}><img src={p.images?.[0]||"https://placehold.co/900x600?text=Sellora"} className="w-full h-52 object-cover"/><div className="p-5"><div className="flex justify-between gap-2"><h3 className="font-bold">{p.name}</h3><span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full">{p.commission_type==="percentage"?p.commission_value+"%":money(p.commission_value)}</span></div><p className="text-sm text-slate-500 mt-2">{p.description}</p><div className="flex justify-between mt-4"><span>{money(p.price)}</span><span className="text-slate-400">{p.category}</span></div><button onClick={()=>link(p.id)} className="mt-5 w-full bg-slate-900 text-white p-3 rounded-xl font-bold">Get Affiliate Link</button></div></div>)}</div>{!items.length&&<div className="text-center text-slate-400 py-20">No published products yet.</div>}</main>}
function Dashboard({user,nav}){let tabs=user.role==="seller"?["overview","products"]:user.role==="creator"?["overview","links","payouts"]:["overview","users","conversions","payouts"],[tab,setTab]=useState("overview");return <main className="max-w-7xl mx-auto px-4 py-8"><p className="text-indigo-600 font-bold">{user.role.toUpperCase()} DASHBOARD</p><div className="flex justify-between gap-3"><h1 className="text-4xl font-black mt-1">Hi, {user.name}.</h1><button onClick={()=>nav("marketplace")} className="border px-4 py-2 rounded-xl">Explore</button></div><div className="flex gap-2 mt-7 overflow-x-auto">{tabs.map(x=><button onClick={()=>setTab(x)} className={"px-4 py-2 rounded-xl "+(tab===x?"bg-slate-900 text-white":"bg-white border")} key={x}>{x}</button>)}</div>{user.role==="seller"&&<Seller tab={tab}/>} {user.role==="creator"&&<Creator tab={tab}/>} {user.role==="admin"&&<Admin tab={tab}/>}</main>}
function Cards({s,fs}){return <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-7">{fs.map(([k,l])=><div className="bg-white border rounded-2xl p-5" key={k}><div className="text-2xl font-black">{["revenue","commission_paid","pending","approved","available","gmv","commissions"].includes(k)?money(s[k]):s[k]||0}</div><div className="text-sm text-slate-500">{l}</div></div>)}</div>}
function Seller({tab}){let[s,setS]=useState({}),[ps,setPs]=useState([]),[f,setF]=useState({name:"",description:"",category:"Technology",price:"",commission_type:"percentage",commission_value:"20",stock:"10",images:[""]});let load=()=>{api("/api/seller/stats").then(setS);api("/api/products/mine").then(setPs)};useEffect(load,[]);async function add(e){e.preventDefault();try{await api("/api/products",{method:"POST",body:JSON.stringify({...f,price:+f.price,commission_value:+f.commission_value,stock:+f.stock})});setF({...f,name:"",description:"",price:""});load()}catch(e){alert(e.message)}}return tab==="overview"?<><Cards s={s} fs={[["products","Products"],["revenue","Revenue"],["clicks","Clicks"],["conversions","Conversions"]]}/><div className="mt-7 bg-white border rounded-3xl p-6"><h2 className="font-black text-xl">Performance</h2><div className="grid md:grid-cols-3 gap-5 mt-6"><M n={s.conversion_rate+"%"} l="Conversion rate"/><M n={s.affiliate_sales} l="Affiliate sales"/><M n={money(s.commission_paid)} l="Commission paid"/></div></div></>:<div className="grid lg:grid-cols-[1fr_1.3fr] gap-6 mt-7"><form onSubmit={add} className="bg-white border rounded-3xl p-6"><h2 className="text-xl font-black">Add product</h2>{["name","description","price","stock"].map(k=><Input key={k} l={k} v={f[k]} c={v=>setF({...f,[k]:v})}/>)}<div className="grid grid-cols-2 gap-2 mt-4"><select value={f.commission_type} onChange={e=>setF({...f,commission_type:e.target.value})} className="border rounded-xl p-3"><option value="percentage">Percentage</option><option value="fixed">Fixed</option></select><input value={f.commission_value} onChange={e=>setF({...f,commission_value:e.target.value})} className="border rounded-xl p-3"/></div><button className="w-full mt-5 bg-indigo-600 text-white p-3 rounded-xl font-bold">Create product</button></form><div className="space-y-3">{ps.map(p=><div className="bg-white border rounded-2xl p-4 flex justify-between" key={p.id}><div><b>{p.name}</b><div className="text-sm text-slate-500">{money(p.price)} · {p.status}</div></div><button onClick={async()=>{await api("/api/products/"+p.id+"/status",{method:"PATCH",body:JSON.stringify({status:p.status==="published"?"unpublished":"published"})});load()}} className="border px-3 py-2 rounded-xl">{p.status==="published"?"Unpublish":"Publish"}</button></div>)}</div></div>}
function Creator({tab}){let[s,setS]=useState({}),[ls,setLs]=useState([]),[cs,setCs]=useState([]),[amt,setAmt]=useState("");let load=()=>{api("/api/creator/stats").then(setS);api("/api/creator/links").then(setLs);api("/api/creator/commissions").then(setCs)};useEffect(load,[]);return tab==="overview"?<><Cards s={s} fs={[["clicks","Clicks"],["conversions","Conversions"],["pending","Pending earnings"],["available","Available balance"]]}/><div className="mt-7 grid md:grid-cols-2 gap-6"><div className="bg-white border rounded-3xl p-6"><h2 className="font-black text-xl">Earnings</h2><p className="mt-4">Pending: {money(s.pending)}</p><p>Approved: {money(s.approved)}</p><p>Available: {money(s.available)}</p></div><div className="bg-white border rounded-3xl p-6"><h2 className="font-black text-xl">QA conversion</h2><p className="text-sm text-slate-500 mt-2">Generate a link from Marketplace, then use this to test a pending commission.</p><button disabled={!ls.length} onClick={async()=>{try{let x=await api("/api/conversions/test",{method:"POST",body:JSON.stringify({affiliate_code:ls[0].code,order_value:2000,order_reference:"TEST-"+Date.now()})});alert("Pending commission "+money(x.commission.amount));load()}catch(e){alert(e.message)}}} className="mt-5 bg-slate-900 text-white px-4 py-3 rounded-xl">Create test conversion</button></div></div></>:tab==="links"?<div className="mt-7 bg-white border rounded-3xl p-6"><h2 className="font-black text-xl">Affiliate links</h2>{ls.map(l=><div className="mt-3 bg-slate-50 p-4 rounded-2xl flex justify-between" key={l.id}><span className="font-mono text-sm">{location.origin}/go/{l.code}</span><span>{l.clicks} clicks · {l.conversions} conversions</span></div>)}</div>:<div className="mt-7 grid md:grid-cols-2 gap-6"><div className="bg-white border rounded-3xl p-6"><h2 className="font-black">Request payout</h2><p className="text-slate-500 mt-2">Available: {money(s.available)}</p><input type="number" value={amt} onChange={e=>setAmt(e.target.value)} className="mt-4 w-full border p-3 rounded-xl" placeholder="Amount"/><button onClick={async()=>{try{await api("/api/payouts",{method:"POST",body:JSON.stringify({amount:+amt,method:"manual",details:{}})});setAmt("");load();alert("Payout requested")}catch(e){alert(e.message)}}} className="mt-3 w-full bg-indigo-600 text-white p-3 rounded-xl">Request</button></div><div className="bg-white border rounded-3xl p-6"><h2 className="font-black">Commission ledger</h2>{cs.map(c=><div className="flex justify-between border-b py-3" key={c.id}><span>{money(c.amount)}</span><span>{c.status}</span></div>)}</div></div>}
function Admin({tab}){let[s,setS]=useState({}),[rows,setRows]=useState([]);let load=()=>{api("/api/admin/stats").then(setS);if(tab==="users")api("/api/admin/users").then(setRows);if(tab==="conversions")api("/api/admin/conversions").then(setRows);if(tab==="payouts")api("/api/admin/payouts").then(setRows)};useEffect(load,[tab]);if(tab==="overview")return <Cards s={s} fs={[["users","Users"],["sellers","Sellers"],["creators","Creators"],["gmv","GMV"]]}/>;let action=async r=>{try{if(tab==="users")await api("/api/admin/users/"+r.id+"/status",{method:"POST",body:JSON.stringify({status:r.status==="active"?"suspended":"active"})});if(tab==="conversions")await api("/api/admin/conversions/"+r.id,{method:"PATCH",body:JSON.stringify({status:"APPROVED"})});if(tab==="payouts")await api("/api/admin/payouts/"+r.id,{method:"PATCH",body:JSON.stringify({status:"PAID"})});load()}catch(e){alert(e.message)}};return <div className="mt-7 bg-white border rounded-3xl p-6"><h2 className="text-xl font-black capitalize">{tab}</h2>{rows.map(r=><div className="mt-3 p-4 bg-slate-50 rounded-2xl flex justify-between items-center" key={r.id}><div><b>{r.email||r.reference||r.id}</b><div className="text-sm text-slate-500">{r.status||""} {r.amount?"· "+money(r.amount):""}</div></div><button onClick={()=>action(r)} className="bg-slate-900 text-white px-3 py-2 rounded-xl">{tab==="users"?"Suspend / restore":tab==="conversions"?"Approve":"Mark paid"}</button></div>)}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
