<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unfolding Rules of Power — Creator Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090909;--card:#121212;--line:#292929;--text:#f5f5f5;--muted:#9b9b9b;--red:#e11;--green:#36d982}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919,#090909 48%);color:var(--text);font:15px Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px}.brand{font-weight:800;letter-spacing:.08em}.hero{text-align:center;padding:75px 10px 45px}.eyebrow{color:#f22;letter-spacing:.2em;font-size:12px;font-weight:800}.hero h1{font:800 clamp(42px,8vw,82px)/.95 Georgia,serif;margin:15px 0}.hero p{max-width:650px;margin:20px auto;color:var(--muted);font-size:18px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(18,18,18,.92);border:1px solid var(--line);border-radius:18px;padding:20px}.stat{font-size:30px;font-weight:800}.label,.muted{color:var(--muted)}.section{margin:22px 0}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.input,.btn{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #383838;background:#0d0d0d;color:#fff}.btn{background:#e21b1b;border-color:#e21b1b;font-weight:800;cursor:pointer}.pill{border:1px solid #333;border-radius:999px;padding:9px 14px;background:transparent;color:#ddd;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}.ok{color:var(--green)}.hide{display:none!important}.msg{margin-top:14px;color:#ff7777;min-height:20px}.small{font-size:12px}.danger{color:#ff7777}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.table{display:block;overflow:auto}}
</style></head>
<body><main class="wrap">
<nav class="nav"><div class="brand">UNFOLDING RULES OF POWER</div><div id="nav"></div></nav>
<div id="app"></div>
</main>
<script>
const SUPABASE_URL="https://ozrnsjalpyawbyacgzfe.supabase.co";
const SUPABASE_KEY="sb_publishable_Xn7kstrNFRXFiZ8TqpYx7w_iWEQk3RR";
const AMAZON="https://www.amazon.in/dp/B0HK6B59PL";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function nav(){ const {data:{user}}=await sb.auth.getUser(); if(!user){$("nav").innerHTML='<button class="pill" onclick="showHome()">Home</button> <button class="pill" onclick="showAuth()">Creator Login</button>';return;} const {data:p}=await sb.from("affiliate_profiles").select("role,name").eq("id",user.id).maybeSingle(); let html='<button class="pill" onclick="showHome()">Home</button> <button class="pill" onclick="showDashboard()">Dashboard</button>'; if(p&&p.role==='admin') html+=' <button class="pill" onclick="showAdmin()">Admin</button>'; html+=' <button class="pill" onclick="signout()">Logout</button>'; $("nav").innerHTML=html; }
async function showHome(){
 await nav();
 $("app").innerHTML='<section class="hero"><div class="eyebrow">CREATOR PARTNER PROGRAM</div><h1>Turn influence<br>into earnings.</h1><p>Share your personal referral link for <b>Unfolding Rules of Power</b>, track clicks and verified sales, and request your commission payout from one simple dashboard.</p><button class="btn" style="width:auto" onclick="showAuth()">Join / Login</button></section><section class="grid"><div class="card"><div class="stat">20%</div><div class="label">Commission rate</div></div><div class="card"><div class="stat">2 days</div><div class="label">Payout processing</div></div><div class="card"><div class="stat">Live</div><div class="label">Click tracking</div></div><div class="card"><div class="stat">₹100</div><div class="label">Minimum withdrawal</div></div></section>';
}
async function showAuth(){
 await nav();
 $("app").innerHTML='<section class="card" style="max-width:470px;margin:70px auto"><div class="eyebrow">CREATOR PORTAL</div><h1 id="authTitle">Welcome back</h1><p class="muted" id="authSub">Sign in to see clicks, verified sales, earnings and withdrawals.</p><input id="email" class="input" placeholder="Email"><br><br><input id="password" class="input" type="password" placeholder="Password"><br><br><input id="name" class="input hide" placeholder="Creator name"><br id="namebr" class="hide"><button class="btn" onclick="submitAuth()">Login</button><p class="msg" id="msg"></p><button class="pill" onclick="toggleSignup()">New creator? Sign up</button></section>';
}
let signup=false;
function toggleSignup(){signup=!signup;$("authTitle").textContent=signup?"Create account":"Welcome back";$("authSub").textContent=signup?"Create your creator account and get your personal referral link.":"Sign in to see clicks, verified sales, earnings and withdrawals.";$("name").classList.toggle("hide",!signup);$("namebr").classList.toggle("hide",!signup);document.querySelector("#app .btn").textContent=signup?"Create account":"Login";}
async function submitAuth(){
 $("msg").textContent="Working…";const email=$("email").value.trim(),password=$("password").value,name=($("name").value||"Creator").trim();
 let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){$("msg").textContent=r.error.message;return}
 if(signup&&r.data.user){const q=await sb.rpc("ensure_affiliate_profile",{p_name:name,p_upi_id:null});if(q.error){$("msg").textContent=q.error.message;return}}
 await refreshRole();
}
async function showDashboard(){
 const {data:{user}}=await sb.auth.getUser();if(!user){showAuth();return}
 const r=await sb.rpc("affiliate_dashboard");if(r.error){$("app").innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}
 const d=r.data; await nav();
 const link=location.origin+"/?ref="+encodeURIComponent(d.link.code);
 $("app").innerHTML='<section class="section"><h1>Welcome, '+esc(d.affiliate.name)+'</h1><p class="muted">Commission rate: <b>20%</b></p></section>'+
 '<section class="grid"><div class="card"><div class="stat">'+d.stats.clicks+'</div><div class="label">Clicks</div></div><div class="card"><div class="stat">'+d.stats.sales+'</div><div class="label">Verified sales</div></div><div class="card"><div class="stat">₹'+Number(d.stats.earned).toFixed(2)+'</div><div class="label">Total earned</div></div><div class="card"><div class="stat">₹'+Number(d.stats.available).toFixed(2)+'</div><div class="label">Available</div></div></section>'+
 '<section class="two section"><div class="card"><h2>Your referral link</h2><input id="ref" class="input" readonly value="'+esc(link)+'"><p class="muted small">Share this link. A click is tracked; a sale is counted only after verification.</p><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'ref\').value)">Copy link</button></div><div class="card"><h2>Withdraw</h2><p class="muted">Minimum ₹100. Requested payouts become eligible after 2 days.</p><button class="btn" '+(Number(d.stats.available)<100?"disabled":"")+' onclick="withdraw()">Request withdrawal</button></div></section>'+
 '<section class="card section"><h2>Recent sales</h2><table class="table"><thead><tr><th>Date</th><th>Order</th><th>Sale</th><th>Commission</th><th>Status</th></tr></thead><tbody>'+(d.sales||[]).map(s=>'<tr><td>'+new Date(s.created_at).toLocaleDateString()+'</td><td>'+esc(s.external_order_ref||"—")+'</td><td>₹'+s.sale_amount+'</td><td>₹'+s.commission_amount+'</td><td class="ok">'+esc(s.status)+'</td></tr>').join("")+'</tbody></table></section>';
}
async function withdraw(){const r=await sb.rpc("request_affiliate_withdrawal");alert(r.error?r.error.message:"Withdrawal requested. It becomes payable after 2 days.");if(!r.error)showDashboard();}
async function signout(){await sb.auth.signOut();await showHome();}
async function showAdmin(){
 const {data:{user}}=await sb.auth.getUser(); if(!user){return showAuth();}
 const {data:profile}=await sb.from("affiliate_profiles").select("role").eq("id",user.id).maybeSingle(); if(profile?.role!=='admin'){alert('Admin access required.');return showDashboard();}
 const r=await sb.rpc("admin_affiliate_overview");if(r.error){alert(r.error.message);return}
 await nav();
 $("app").innerHTML='<section class="card section"><div class="eyebrow">ADMIN</div><h1>Creator payouts</h1><h2>Record verified sale</h2><div class="two"><input id="aid" class="input" placeholder="Affiliate ID"><input id="amt" class="input" placeholder="Sale amount ₹"></div><br><input id="ord" class="input" placeholder="Amazon/order reference"><br><br><button class="btn" onclick="recordSale()">Add verified sale</button><p class="muted small">Only verified conversions should be entered here.</p></section><section class="card"><table class="table"><thead><tr><th>Creator</th><th>ID</th><th>Clicks</th><th>Sales</th><th>Earned</th><th>Withdrawal</th><th></th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="small">'+esc(x.affiliate_id)+'</td><td>'+x.clicks+'</td><td>'+x.sales+'</td><td>₹'+x.earned+'</td><td>'+esc(x.withdrawal_status||"—")+'</td><td>'+(x.withdrawal_id&&x.withdrawal_status==="requested"?'<button class="pill" onclick="approve(\''+x.withdrawal_id+'\')">Mark paid</button>':"—")+'</td></tr>').join("")+'</tbody></table></section>';
}
async function recordSale(){const r=await sb.rpc("admin_record_conversion",{p_affiliate_id:$("aid").value.trim(),p_sale_amount:Number($("amt").value),p_external_order_ref:$("ord").value.trim()||null});alert(r.error?r.error.message:"Verified sale recorded.");if(!r.error)showAdmin();}
async function approve(id){const r=await sb.rpc("admin_approve_withdrawal",{p_withdrawal_id:id});alert(r.error?r.error.message:"Marked paid.");if(!r.error)showAdmin();}
async function refreshRole(){ await nav(); const {data:{user}}=await sb.auth.getUser(); if(!user)return showHome(); const {data:p}=await sb.from("affiliate_profiles").select("role").eq("id",user.id).maybeSingle(); return p?.role==='admin'?showAdmin():showDashboard(); }
async function handleReferral(){
 const ref=new URLSearchParams(location.search).get("ref");if(!ref)return false;
 let token=localStorage.getItem("urp_visitor");if(!token){token=crypto.randomUUID();localStorage.setItem("urp_visitor",token)}
 const r=await sb.rpc("record_referral_click",{p_code:ref,p_visitor_token:token,p_ip:null,p_user_agent:navigator.userAgent,p_referrer:document.referrer||null});
 window.location.replace((r.data&&r.data.url)||AMAZON);return true;
}
(async()=>{if(await handleReferral())return; const {data:{user}}=await sb.auth.getUser(); if(user) await refreshRole(); else await showHome(); sb.auth.onAuthStateChange((_event,session)=>{ if(session?.user) refreshRole(); else showHome(); });})();
</script></body></html>
