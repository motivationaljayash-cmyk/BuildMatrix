  if(ms<=0)return "Eligible now";

  html.push('<section class="two section"><div class="card"><div class="section-title"><h2>💸 Payout</h2>'+statusBadge(payout?payout.status:"not requested")+'</div><div class="row"><div><div class="stat">'+formatMoney(st.available)+'</div><div class="label">Available balance</div></div><div class="center"><div class="muted small">Minimum</div><b>'+formatMoney(100)+'</b></div></div>'+(payout&&payout.status==="requested"?'<div class="notice" style="margin-top:14px"><b>Requested '+formatMoney(payout.amount)+'</b><div class="muted small" style="margin-top:5px">'+timeLeft(payout.eligible_at)+'</div></div>':'<button class="btn" style="margin-top:14px" '+(Number(st.available)<100?"disabled":"")+' onclick="requestWithdrawal()">Request payout</button>')+'<p class="muted small">Payout eligibility starts 2 days after a request. Payment is sent manually by the program admin.</p></div><div class="card"><h2>📜 Payout history</h2>'+renderWithdrawals(d.withdrawals||[])+'</div></section>');
  html.push('<section class="card section"><div class="section-title"><h2>💰 Payment details</h2><span class="muted small">Private and used only for your payouts</span></div><p class="muted small">UPI is the simplest option. Choose bank transfer only when you have the full bank details ready.</p><div class="row"><label><input type="radio" name="payMethod" value="upi" '+((d.affiliate.payment_method||"upi")==="upi"?"checked":"")+' onchange="togglePaymentFields()"> UPI</label><label><input type="radio" name="payMethod" value="bank" '+((d.affiliate.payment_method||"upi")==="bank"?"checked":"")+' onchange="togglePaymentFields()"> Bank transfer</label></div><br><div id="upiFields" class="'+((d.affiliate.payment_method||"upi")==="upi"?"":"hide")+'"><input id="upi" class="input" placeholder="UPI ID" value="'+esc(d.affiliate.upi_id||"")+'"></div><div id="bankFields" class="'+((d.affiliate.payment_method||"upi")==="bank"?"":"hide")+'"><div class="two"><input id="bankHolder" class="input" placeholder="Account holder name" value="'+esc(d.affiliate.bank_account_holder||"")+'"><input id="bankName" class="input" placeholder="Bank name" value="'+esc(d.affiliate.bank_name||"")+'"></div><br><div class="two"><input id="bankNumber" class="input" placeholder="Account number" value="'+esc(d.affiliate.bank_account_number||"")+'"><input id="bankIfsc" class="input" placeholder="IFSC" value="'+esc(d.affiliate.bank_ifsc||"")+'"></div></div><br><button class="btn" onclick="savePayment()">Save payment details</button><p class="msg" id="paymentMsg"></p></section>');
  html.push('<section class="two section"><div class="card"><div class="section-title"><h2>🔔 Notifications</h2><button class="pill" onclick="markNotificationsRead()">Mark all read</button></div>'+renderNotifications(d.notifications||[])+'</div><div class="card"><h2>🏆 Creator leaderboard</h2><p class="muted small">Only creators who opt in are shown publicly inside the portal.</p><label class="row"><span>Show me on the leaderboard</span><input type="checkbox" id="leaderOpt" '+(d.affiliate.leaderboard_opt_in?"checked":"")+' onchange="setLeaderboard(this.checked)"></label><div style="margin-top:14px">'+renderLeaderboard(d.leaderboard||[])+'</div></div></section>');
  html.push('<section class="card section"><div class="section-title"><h2>❓ Help center</h2><button class="pill" onclick="showHelp()">Open help</button></div><p class="muted">Need to understand a status, payout, or promotion rule? Open the help center for quick answers.</p></section>');
  html.push('<div class="footer">Creator commission: 20% on verified book sales. Amazon purchase verification is independent from click tracking.</div>');
  $("app").innerHTML=html.join("");
}
function renderCampaigns(items){
  if(!items.length)return '<div class="empty">No campaign links yet. Create one above for YouTube, Instagram, WhatsApp or another channel.</div>';
  return items.map(function(x){const url=referralUrl(x.code);return '<div class="item"><div class="row"><div><b>'+esc(x.name)+'</b><div class="muted small">'+esc(x.platform)+' · '+Number(x.clicks||0)+' clicks · '+formatDate(x.created_at)+'</div></div>'+statusBadge(x.active?"active":"inactive")+'</div><div class="linkbox" style="margin-top:10px"><input class="input" readonly value="'+esc(url)+'"><button class="pill" data-copy="'+esc(url)+'" onclick="copyData(this)">Copy</button>'+(x.active?'<button class="pill" data-id="'+esc(x.id)+'" onclick="deactivateCampaign(this.dataset.id)">Stop</button>':"")+'</div></div>'}).join("");
}
function renderWithdrawals(items){
  if(!items.length)return '<div class="empty">No payout requests yet.</div>';
  return '<div class="list">'+items.map(function(x){return '<div class="item"><div class="row"><b>'+formatMoney(x.amount)+'</b>'+statusBadge(x.status)+'</div><div class="muted small" style="margin-top:6px">Requested '+formatDate(x.requested_at)+(x.status==="requested"?" · "+timeLeft(x.eligible_at):x.paid_at?" · Paid "+formatDate(x.paid_at):"")+'</div>'+(x.payout_reference?'<div class="muted small">Reference: '+esc(x.payout_reference)+'</div>':"")+'</div>'}).join("")+'</div>';
}
function renderNotifications(items){
  if(!items.length)return '<div class="empty">No creator notifications yet.</div>';
  return '<div class="list">'+items.map(function(x){return '<div class="item"><div class="row"><b>'+esc(x.title)+'</b><span class="muted small">'+formatDate(x.created_at)+'</span></div><div class="muted small" style="margin-top:6px">'+esc(x.message)+'</div></div>'}).join("")+'</div>';
}
function renderLeaderboard(items){
  if(!items.length)return '<div class="empty">No opted-in creators yet. Turn on the switch above to join.</div>';
  return '<div class="list">'+items.map(function(x){return '<div class="item"><div class="row"><span><span class="rank">#'+x.rank+'</span> <b>'+esc(x.name)+'</b></span><span class="muted small">'+x.sales+' sales · '+formatMoney(x.earned)+'</span></div></div>'}).join("")+'</div>';
}
function dismissOnboarding(){localStorage.setItem("urp_creator_onboarded_v2","1");renderDashboard()}
function copyPromotion(kind){
  const url=referralUrl(state.link.code);
  const templates={
    caption:"I have been exploring "+BOOK_NAME+" and found it worth sharing. If you like psychology, influence and understanding people better, check it out here: "+url,
    youtube:"Book recommendation: "+BOOK_NAME+"\n\nIf you are interested in psychology, influence and understanding human behavior, you can check it out here:\n"+url,
    whatsapp:"Sharing a book I think you may enjoy: "+BOOK_NAME+"\n\nCheck it out here: "+url,
    reel:"Hook: Most people think influence is about speaking louder.\n\nBody: "+BOOK_NAME+" explores the psychology behind influence, behavior and human decisions.\n\nCTA: Check it out here: "+url
  };
  copyTextValue(templates[kind]||templates.caption);
}
async function createCampaign(){
  try{
    const name=$("campaignName").value.trim(),platform=$("campaignPlatform").value;
    if(!name){$("campaignMsg").textContent="Enter a campaign name.";return}
    $("campaignMsg").textContent="Creating…";
    const r=await sb.rpc("create_affiliate_campaign",{p_name:name,p_platform:platform});
    if(r.error){$("campaignMsg").textContent=r.error.message;return}
    toast("Campaign created");await loadDashboardSilently();
  }catch(e){showError(e)}
}
async function deactivateCampaign(id){
  try{
    if(!confirm("Stop this campaign link?"))return;
    const r=await sb.rpc("deactivate_affiliate_campaign",{p_campaign_id:id});
    if(r.error){toast(r.error.message);return}
    toast("Campaign stopped");await loadDashboardSilently();
  }catch(e){showError(e)}
}
function togglePaymentFields(){
  const m=document.querySelector("input[name='payMethod']:checked").value;
  $("upiFields").classList.toggle("hide",m!=="upi");$("bankFields").classList.toggle("hide",m!=="bank");
}
async function savePayment(){
  try{
    const m=document.querySelector("input[name='payMethod']:checked").value;
    const r=await sb.rpc("update_affiliate_payment_details",{p_payment_method:m,p_upi_id:m==="upi"?$("upi").value.trim():null,p_bank_account_holder:m==="bank"?$("bankHolder").value.trim():null,p_bank_account_number:m==="bank"?$("bankNumber").value.trim():null,p_bank_ifsc:m==="bank"?$("bankIfsc").value.trim():null,p_bank_name:m==="bank"?$("bankName").value.trim():null});
    $("paymentMsg").textContent=r.error?r.error.message:"Payment details saved securely.";
    if(!r.error)toast("Payment details saved");
  }catch(e){showError(e)}
}
async function setLeaderboard(enabled){
  try{const r=await sb.rpc("set_affiliate_leaderboard_opt_in",{p_enabled:enabled});if(r.error){toast(r.error.message);return}toast(enabled?"Leaderboard opt-in saved":"Leaderboard opt-out saved");await loadDashboardSilently()}catch(e){showError(e)}
}
async function markNotificationsRead(){
  try{const r=await sb.rpc("mark_affiliate_notifications_read");if(r.error){toast(r.error.message);return}await loadDashboardSilently()}catch(e){showError(e)}
}
async function requestWithdrawal(){
  try{
    if(Number(state.stats.available)<100){toast("You need at least ₹100 available.");return}
    const r=await sb.rpc("request_affiliate_withdrawal");if(r.error){toast(r.error.message);return}
    toast("Payout requested. It becomes eligible after 2 days.");await loadDashboardSilently();
  }catch(e){showError(e)}
}
async function showHelp(){
  try{
    await nav();
    $("app").innerHTML='<section class="card section"><div class="eyebrow">HELP CENTER</div><h1>Creator help</h1><p class="muted">Everything important about links, sales, earnings and payouts.</p><div id="helpFaq"></div><div class="successbox" style="margin-top:18px"><b>Need support?</b><p class="muted small">Use the contact method provided by the program owner for payout or account issues.</p></div></section>';
    renderFaq("helpFaq");
  }catch(e){showError(e)}
}
async function showAdmin(){
  try{
    const user=await getUser();if(!user){await showAuth();return}
    const profile=await sb.from("affiliate_profiles").select("role").eq("id",user.id).maybeSingle();
    if(profile.data&&profile.data.role!=="admin"){toast("Admin access required");await showDashboard();return}
    const results=await Promise.all([sb.rpc("admin_attribution_overview"),sb.rpc("admin_affiliate_overview")]);
    const a=results[0],r=results[1];if(a.error)throw a.error;if(r.error)throw r.error;
    await nav();
    const mapped=(a.data||[]).filter(function(x){return x.mapped}).length;
    $("app").innerHTML='<section class="card section"><div class="eyebrow">ADMIN</div><h1>Creator program control</h1><p class="muted">Manage attribution mapping, verify sales, and process payout requests.</p><div class="grid"><div class="card"><div class="stat">'+r.data.length+'</div><div class="label">Creators</div></div><div class="card"><div class="stat">'+r.data.reduce(function(a,x){return a+Number(x.clicks||0)},0)+'</div><div class="label">Total clicks</div></div><div class="card"><div class="stat">'+r.data.reduce(function(a,x){return a+Number(x.sales||0)},0)+'</div><div class="label">Verified sales</div></div><div class="card"><div class="stat">'+mapped+'</div><div class="label">Attribution mappings</div></div></div></section>'+
      '<section class="card section"><div class="section-title"><h2>Amazon Attribution</h2><span class="badge amber"><span class="dot"></span>API connection depends on Amazon access</span></div><p class="muted small">Map one Amazon Attribution tag/publisher per creator. The sync function is server-side and only adds commissions when attribution data is verified.</p><button class="btn" onclick="runAmazonSync()">Sync Amazon conversions</button><p id="syncMsg" class="msg"></p></section>'+
      '<section class="card section"><h2>Creator attribution mapping</h2><div class="table-wrap"><table class="table"><thead><tr><th>Creator</th><th>Code</th><th>Tag ID</th><th>Publisher</th><th>Destination URL</th><th></th></tr></thead><tbody>'+
      (a.data||[]).map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><div class="muted small">'+esc(x.email)+'</div></td><td>'+esc(x.code||"—")+'</td><td><input id="tag-'+x.affiliate_id+'" class="input" value="'+esc(x.tag_id||"")+'" placeholder="Tag ID"></td><td><input id="pub-'+x.affiliate_id+'" class="input" value="'+esc(x.publisher_id||"")+'" placeholder="Publisher ID"></td><td><input id="url-'+x.affiliate_id+'" class="input" value="'+esc(x.destination_url||AMAZON)+'" placeholder="Amazon Attribution destination"></td><td><button class="pill" data-id="'+esc(x.affiliate_id)+'" onclick="saveAttribution(this.dataset.id)">Save</button></td></tr>'}).join("")+
      '</tbody></table></div></section>'+
      '<section class="card section"><h2>Manual verified sale</h2><p class="muted small">Use only after independent verification. Duplicate order references are blocked per creator.</p><div class="two"><select id="aid" class="input"><option value="">Select creator</option>'+r.data.map(function(x){return '<option value="'+esc(x.affiliate_id)+'">'+esc(x.name)+' — '+esc(x.affiliate_id)+'</option>'}).join("")+'</select><div class="two"><input id="amt" class="input" type="number" min="0.01" step="0.01" placeholder="Sale amount ₹"><input id="ord" class="input" placeholder="Order reference (optional)"></div></div><br><button class="btn" onclick="recordSale()">Add verified sale</button></section>'+
      '<section class="card section"><h2>Creators & payouts</h2><div class="table-wrap"><table class="table"><thead><tr><th>Creator</th><th>Clicks</th><th>Sales</th><th>Earned</th><th>Latest payout</th><th></th></tr></thead><tbody>'+
      r.data.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><div class="muted small">Payment details are stored privately in the creator profile.</div></td><td>'+x.clicks+'</td><td>'+x.sales+'</td><td>'+formatMoney(x.earned)+'</td><td>'+formatMoney(x.withdrawal_amount||0)+' · '+esc(x.withdrawal_status||"—")+'</td><td>'+(x.withdrawal_id&&x.withdrawal_status==="requested"?'<button class="pill" data-id="'+esc(x.withdrawal_id)+'" onclick="approve(this.dataset.id)">Mark paid</button>':"—")+'</td></tr>'}).join("")+
      '</tbody></table></div></section>';
  }catch(e){showError(e)}
}
async function saveAttribution(id){
  try{
    const tag=$("tag-"+id).value.trim(),publisher=$("pub-"+id).value.trim(),url=$("url-"+id).value.trim();
    if(!url){toast("Paste the Amazon Attribution destination URL first.");return}
    const r=await sb.rpc("admin_upsert_attribution_tag",{p_affiliate_id:id,p_tag_id:tag||null,p_publisher_id:publisher||null,p_destination_url:url,p_asin:"B0HK6B59PL"});
    toast(r.error?r.error.message:"Attribution mapping saved.");if(!r.error)await showAdmin();
  }catch(e){showError(e)}
}
async function runAmazonSync(){
  try{
    $("syncMsg").textContent="Syncing…";
    const r=await sb.functions.invoke("amazon-attribution-sync",{body:{mode:"sync"}});
    if(r.error){$("syncMsg").textContent=r.error.message;return}
    const d=r.data||{};
    $("syncMsg").textContent=d.status==="not_configured"?"Amazon Attribution access is not configured yet. Database and portal support are ready, but live API credentials/access still need to be configured as server-side Supabase secrets.":"Sync result: "+JSON.stringify(d);
    await showAdmin();
  }catch(e){showError(e)}
}
async function recordSale(){
  try{
    const affiliateId=$("aid").value,amount=Number($("amt").value),order=$("ord").value.trim();
    if(!affiliateId){toast("Select a creator first.");return}
    if(!Number.isFinite(amount)||amount<=0){toast("Enter a valid sale amount.");return}
    const r=await sb.rpc("admin_record_conversion",{p_affiliate_id:affiliateId,p_sale_amount:amount,p_external_order_ref:order||null});
    toast(r.error?r.error.message:"Verified sale recorded.");if(!r.error)await showAdmin();
  }catch(e){showError(e)}
}
async function approve(id){
  try{
    const ref=prompt("Optional payout reference (UPI/transfer reference):","");
    if(ref===null)return;
    const r=await sb.rpc("admin_approve_withdrawal",{p_withdrawal_id:id,p_payout_reference:ref.trim()||null});
    toast(r.error?r.error.message:"Payout marked paid.");if(!r.error)await showAdmin();
  }catch(e){showError(e)}
}
async function signout(){clearInterval(refreshTimer);await sb.auth.signOut();await showHome()}
async function handleReferral(){
  const ref=new URLSearchParams(location.search).get("ref");
  if(!ref)return false;
  $("app").innerHTML='<section class="hero"><div class="eyebrow">OPENING BOOK PAGE</div><h1>Taking you to Amazon…</h1><p>Please wait a moment.</p></section>';
  try{
    let token=localStorage.getItem("urp_visitor");if(!token){token=crypto.randomUUID();localStorage.setItem("urp_visitor",token)}
    const r=await sb.rpc("record_referral_click",{p_code:ref,p_visitor_token:token,p_ip:null,p_user_agent:navigator.userAgent,p_referrer:document.referrer||null});
    window.location.replace((r.data&&r.data.url)||AMAZON);
  }catch(e){window.location.replace(AMAZON)}
  return true;
}
(async function(){
  try{
    if(await handleReferral())return;
    await nav();
    const user=await getUser();
    if(user)await refreshRole();else await showHome();
    if(!authListener){
      authListener=sb.auth.onAuthStateChange(function(event,session){
        if(event==="PASSWORD_RECOVERY"){showAuth()}
        else if(session&&session.user){refreshRole()}
        else if(!session){showHome()}
      });
    }
  }catch(e){showError(e)}
})();
</script>
</body>
</html>
