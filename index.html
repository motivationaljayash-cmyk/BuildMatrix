<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unfolding Rules of Power — Creator Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#090909;--card:#121212;--line:#292929;--text:#f5f5f5;--muted:#9b9b9b;--red:#e11;--green:#36d982}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919,#090909 48%);color:var(--text);font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px}.brand{font-weight:800;letter-spacing:.08em}.hero{text-align:center;padding:75px 10px 45px}.eyebrow{color:#f22;letter-spacing:.2em;font-size:12px;font-weight:800}.hero h1{font:800 clamp(42px,8vw,82px)/.95 Georgia,serif;margin:15px 0}.hero p{max-width:650px;margin:20px auto;color:var(--muted);font-size:18px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(18,18,18,.92);border:1px solid var(--line);border-radius:18px;padding:20px}.stat{font-size:30px;font-weight:800}.label,.muted{color:var(--muted)}.section{margin:22px 0}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.input,.btn{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #383838;background:#0d0d0d;color:#fff}.btn{background:#e21b1b;border-color:#e21b1b;font-weight:800;cursor:pointer}.pill{border:1px solid #333;border-radius:999px;padding:9px 14px;background:transparent;color:#ddd;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}.ok{color:var(--green)}.hide{display:none!important}.msg{margin-top:14px;color:#ff7777;min-height:20px}.small{font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.table{display:block;overflow:auto}}
</style></head><body><main class="wrap"><nav class="nav"><div class="brand">UNFOLDING RULES OF POWER</div><div id="nav"></div></nav><div id="app"></div></main><script>
const SUPABASE_URL="https://ozrnsjalpyawbyacgzfe.supabase.co";
const SUPABASE_KEY=atob("c2JfcHVibGlzaGFibGVfWG43a3N0ck5GUlhGaVo4VHFwWXg3d19pV0VRazNSUg==");
const AMAZON="https://www.amazon.in/dp/B0HK6B59PL";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function nav(){const {data:{user}}=await sb.auth.getUser();if(!user){$("nav").innerHTML='<button class="pill" onclick="showHome()">Home</button> <button class="pill" onclick="showAuth()">Creator Login</button>';return}const {data:p}=await sb.from("affiliate_profiles").select("role,name").eq("id",user.id).maybeSingle();let h='<button class="pill" onclick="showHome()">Home</button> <button class="pill" onclick="showDashboard()">Dashboard</button>';if(p?.role==="admin")h+=' <button class="pill" onclick="showAdmin()">Admin</button>';h+=' <button class="pill" onclick="signout()">Logout</button>';$("nav").innerHTML=h}
async function showHome(){await nav();const {data:{user}}=await sb.auth.getUser();$("app").innerHTML='<section class="hero"><div class="eyebrow">CREATOR PARTNER PROGRAM</div><h1>Turn influence<br>into earnings.</h1><p>Share your personal referral link for <b>Unfolding Rules of Power</b>, track clicks and verified sales, and request your commission payout from one simple dashboard.</p><button class="btn" style="width:auto" onclick="'+(user?"showDashboard()":"showAuth()")+'">'+(user?"Open dashboard":"Join / Login")+'</button></section><section class="grid"><div class="card"><div class="stat">20%</div><div class="label">Commission rate</div></div><div class="card"><div class="stat">2 days</div><div class="label">Payout processing</div></div><div class="card"><div class="stat">Live</div><div class="label">Click tracking</div></div><div class="card"><div class="stat">₹100</div><div class="label">Minimum withdrawal</div></div></section>'}
async function showAuth(){await nav();$("app").innerHTML='<section class="card" style="max-width:470px;margin:70px auto"><div class="eyebrow">CREATOR PORTAL</div><h1 id="authTitle">Welcome back</h1><p class="muted" id="authSub">Sign in to see clicks, verified sales, earnings and withdrawals.</p><input id="email" class="input" placeholder="Email"><br><br><input id="password" class="input" type="password" placeholder="Password"><br><br><input id="name" class="input hide" placeholder="Creator name"><br id="namebr" class="hide"><button class="btn" onclick="submitAuth()">Login</button><p class="msg" id="msg"></p><button class="pill" onclick="toggleSignup()">New creator? Sign up</button></section>'}
let signup=false;function toggleSignup(){signup=!signup;$("authTitle").textContent=signup?"Create account":"Welcome back";$("authSub").textContent=signup?"Create your creator account and get your personal referral link.":"Sign in to see clicks, verified sales, earnings and withdrawals.";$("name").classList.toggle("hide",!signup);$("namebr").classList.toggle("hide",!signup);document.querySelector("#app .btn").textContent=signup?"Create account":"Login"}
async function submitAuth(){$("msg").textContent="Working…";const email=$("email").value.trim(),password=$("password").value,name=($("name").value||"Creator").trim();let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error){$("msg").textContent=r.error.message;return}if(signup&&r.data.user){const q=await sb.rpc("ensure_affiliate_profile",{p_name:name,p_upi_id:null});if(q.error){$("msg").textContent=q.error.message;return}}await refreshRole()}
async function savePaymentDetails(){const value=$("payment").value.trim();if(!value){alert("Enter your UPI ID or bank account number.");return}const {data:{user}}=await sb.auth.getUser();if(!user)return showAuth();const r=await sb.from("affiliate_profiles").update({upi_id:value}).eq("id",user.id);alert(r.error?r.error.message:"Payment details saved.");if(!r.error)showDashboard()}
async function showDashboard(){const {data:{user}}=await sb.auth.getUser();if(!user)return showAuth();const r=await sb.rpc("affiliate_dashboard");if(r.error){$("app").innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}const d=r.data;await nav();const link=location.origin+"/?ref="+encodeURIComponent(d.link.code);$("app").innerHTML='<section class="section"><h1>Welcome, '+esc(d.affiliate.name)+'</h1><p class="muted">Commission rate: <b>20%</b></p></section><section class="grid"><div class="card"><div class="stat">'+d.stats.clicks+'</div><div class="label">Clicks</div></div><div class="card"><div class="stat">'+d.stats.sales+'</div><div class="label">Verified sales</div></div><div class="card"><div class="stat">₹'+Number(d.stats.earned).toFixed(2)+'</div><div class="label">Total earned</div></div><div class="card"><div class="stat">₹'+Number(d.stats.available).toFixed(2)+'</div><div class="label">Available</div></div></section><section class="two section"><div class="card"><h2>Your referral link</h2><input id="ref" class="input" readonly value="'+esc(link)+'"><p class="muted small">Clicks are tracked automatically. Sales are credited after Amazon Attribution verification is connected.</p><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'ref\').value)">Copy link</button></div><div class="card"><h2>Withdraw</h2><p class="muted">Minimum ₹100. Requested payouts become eligible after 2 days.</p><button class="btn" '+(Number(d.stats.available)<100?"disabled":"")+' onclick="withdraw()">Request withdrawal</button></div></section><section class="card section"><h2>💰 Where should we send your earnings?</h2><p class="muted">Enter your UPI ID or Bank Account Number where you'd like to receive your commission.</p><input id="payment" class="input" placeholder="UPI ID or Bank Account Number" value="'+esc(d.affiliate.upi_id||"")+'"><br><br><p class="muted small">🔒 Your payment details are kept private and used only to process your earnings.</p><button class="btn" onclick="savePaymentDetails()">Save payment details</button></section><section class="card section"><h2>Recent sales</h2><table class="table"><thead><tr><th>Date</th><th>Order</th><th>Sale</th><th>Commission</th><th>Status</th></tr></thead><tbody>'+(d.sales||[]).map(s=>'<tr><td>'+new Date(s.created_at).toLocaleDateString()+'</td><td>'+esc(s.external_order_ref||"—")+'</td><td>₹'+s.sale_amount+'</td><td>₹'+s.commission_amount+'</td><td class="ok">'+esc(s.status)+'</td></tr>').join("")+'</tbody></table></section>'}
async function withdraw(){const r=await sb.rpc("request_affiliate_withdrawal");alert(r.error?r.error.message:"Withdrawal requested. It becomes payable after 2 days.");if(!r.error)showDashboard()}async function signout(){await sb.auth.signOut();await showHome()}
async function saveAttribution(id){const tag=$("tag-"+id).value.trim(),publisher=$("pub-"+id).value.trim(),url=$("url-"+id).value.trim();if(!url){alert("Paste the Amazon Attribution destination/tagged URL first.");return}const r=await sb.rpc("admin_upsert_attribution_tag",{p_affiliate_id:id,p_tag_id:tag||null,p_publisher_id:publisher||null,p_destination_url:url,p_asin:"B0HK6B59PL"});alert(r.error?r.error.message:"Amazon Attribution mapping saved. The creator's live referral redirect was updated.");if(!r.error)showAdmin()}
async function runAmazonSync(){try{const r=await sb.functions.invoke("amazon-attribution-sync",{body:{mode:"sync"}});if(r.error){alert(r.error.message);return}const d=r.data||{};alert(d.status==="not_configured"?"Amazon Attribution API access is not configured yet. The database and portal are ready; the Amazon API credentials/access still need to be added as Supabase Edge Function secrets.":("Amazon sync result: "+JSON.stringify(d)));await showAdmin()}catch(e){alert("Sync request failed: "+e.message)}}
async function showAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return showAuth();const {data:profile}=await sb.from("affiliate_profiles").select("role").eq("id",user.id).maybeSingle();if(profile?.role!=="admin"){alert("Admin access required.");return showDashboard()}const r=await sb.rpc("admin_affiliate_overview");if(r.error){alert(r.error.message);return}const a=await sb.rpc("admin_attribution_overview");if(a.error){alert(a.error.message);return}await nav();$("app").innerHTML='<section class="card section"><div class="eyebrow">AMAZON ATTRIBUTION</div><h1>Automatic conversion syncing</h1><p class="muted">Amazon Attribution is the measurement layer for external creator/influencer traffic. Amazon documents purchases, units sold and product sales, with reporting dimensions including publisher, order and product ASIN, and a 14-day attribution window.</p><div class="grid"><div class="card"><div class="stat">Ready</div><div class="label">Database mapping</div></div><div class="card"><div class="stat">'+a.data.filter(x=>x.mapped).length+'</div><div class="label">Creators mapped</div></div><div class="card"><div class="stat">API</div><div class="label">Connection pending</div></div><div class="card"><div class="stat">14d</div><div class="label">Attribution window</div></div></div><br><button class="btn" onclick="runAmazonSync()">Sync Amazon conversions</button><p class="muted small">Amazon secrets stay server-side in Supabase; nothing sensitive is placed in this browser page.</p></section><section class="card section"><h2>Creator attribution mapping</h2><p class="muted small">Create one Amazon Attribution tag/campaign per creator and paste the Amazon-generated destination URL here. Saving it also changes that creator&apos;s referral redirect.</p><table class="table"><thead><tr><th>Creator</th><th>Creator link</th><th>Attribution tag ID</th><th>Publisher</th><th>Amazon destination URL</th><th></th></tr></thead><tbody>'+a.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="small">'+esc(x.code||"—")+'</td><td><input id="tag-'+x.affiliate_id+'" class="input" value="'+esc(x.tag_id||"")+'" placeholder="Tag ID"></td><td><input id="pub-'+x.affiliate_id+'" class="input" value="'+esc(x.publisher_id||"")+'" placeholder="Publisher ID"></td><td><input id="url-'+x.affiliate_id+'" class="input" value="'+esc(x.destination_url||AMAZON)+'" placeholder="Amazon Attribution URL"></td><td><button class="pill" onclick="saveAttribution(\''+x.affiliate_id+'\')">Save</button></td></tr>').join("")+'</tbody></table></section><section class="card section"><h2>Manual fallback</h2><p class="muted small">Use this only for a sale you have independently verified. Choose the creator instead of copying an Affiliate ID.</p><select id="aid" class="input"><option value="">Select creator</option>'+r.data.map(x=>'<option value="'+esc(x.affiliate_id)+'">'+esc(x.name)+' — '+esc(x.affiliate_id)+'</option>').join("")+'</select><br><br><div class="two"><input id="amt" class="input" type="number" min="0.01" step="0.01" placeholder="Sale amount ₹"><input id="ord" class="input" placeholder="Amazon/order reference (optional)"></div><br><button class="btn" onclick="recordSale()">Add verified sale</button></section><section class="card section"><table class="table"><thead><tr><th>Creator</th><th>ID</th><th>Clicks</th><th>Sales</th><th>Earned</th><th>Withdrawal</th><th></th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="small">'+esc(x.affiliate_id)+'</td><td>'+x.clicks+'</td><td>'+x.sales+'</td><td>₹'+x.earned+'</td><td>'+esc(x.withdrawal_status||"—")+'</td><td>'+(x.withdrawal_id&&x.withdrawal_status==="requested"?'<button class="pill" onclick="approve(\''+x.withdrawal_id+'\')">Mark paid</button>':"—")+'</td></tr>').join("")+'</tbody></table></section>'}
async function recordSale(){const affiliateId=$("aid").value;if(!affiliateId){alert("Select a creator first.");return}const amount=Number($("amt").value);if(!Number.isFinite(amount)||amount<=0){alert("Enter a valid sale amount.");return}const order=$("ord").value.trim();const r=await sb.rpc("admin_record_conversion",{p_affiliate_id:affiliateId,p_sale_amount:amount,p_external_order_ref:order||null});alert(r.error?r.error.message:"Verified sale recorded.");if(!r.error)showAdmin()}async function approve(id){const r=await sb.rpc("admin_approve_withdrawal",{p_withdrawal_id:id});alert(r.error?r.error.message:"Marked paid.");if(!r.error)showAdmin()}
async function refreshRole(){await nav();const {data:{user}}=await sb.auth.getUser();if(!user)return showHome();const {data:p}=await sb.from("affiliate_profiles").select("role").eq("id",user.id).maybeSingle();return p?.role==="admin"?showAdmin():showDashboard()}
async function handleReferral(){const ref=new URLSearchParams(location.search).get("ref");if(!ref)return false;let token=localStorage.getItem("urp_visitor");if(!token){token=crypto.randomUUID();localStorage.setItem("urp_visitor",token)}const r=await sb.rpc("record_referral_click",{p_code:ref,p_visitor_token:token,p_ip:null,p_user_agent:navigator.userAgent,p_referrer:document.referrer||null});window.location.replace((r.data&&r.data.url)||AMAZON);return true}
(async()=>{if(await handleReferral())return;const {data:{user}}=await sb.auth.getUser();if(user)await refreshRole();else await showHome();sb.auth.onAuthStateChange((_event,session)=>{if(session?.user)refreshRole();else showHome()})})();
</script></body></html>
