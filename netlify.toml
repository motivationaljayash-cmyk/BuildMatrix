[build]
  command = '''rm -rf .netlify-build && mkdir .netlify-build && unzip -q 'BuildMatrix-unified-signup(1).zip' -d .netlify-build && cd .netlify-build/project && mkdir -p public && printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' '<url><loc>https://buildmx.netlify.app/</loc></url>' '<url><loc>https://buildmx.netlify.app/marketplace</loc></url>' '<url><loc>https://buildmx.netlify.app/categories</loc></url>' '<url><loc>https://buildmx.netlify.app/about</loc></url>' '<url><loc>https://buildmx.netlify.app/contact</loc></url>' '</urlset>' > public/sitemap.xml && printf '%s\n' 'User-agent: *' 'Allow: /' 'Disallow: /buyer' 'Disallow: /seller' 'Disallow: /admin' 'Disallow: /transporter' 'Disallow: /login' 'Disallow: /signup' 'Disallow: /forgot-password' 'Sitemap: https://buildmx.netlify.app/sitemap.xml' > public/robots.txt && perl -0pi -e 's#<title>.*?</title>#<title>BuildMatrix | Construction Materials Marketplace</title>#si; s#<meta name="description"[^>]*>\\s*##i; s#<script type="application/ld\\+json">.*?</script>\\s*##gis' index.html && sed -i 's#</head>#<meta name="description" content="BuildMatrix is a construction materials marketplace connecting buyers with verified sellers, products, and construction supply services." />\\n<meta name="robots" content="index, follow" />\\n<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"BuildMatrix","url":"https://buildmx.netlify.app/","description":"Construction materials marketplace connecting buyers with sellers and construction supply services."},{"@type":"WebSite","name":"BuildMatrix","url":"https://buildmx.netlify.app/"}]}</script>\\n<meta name="google-site-verification" content="3keVVwvEx1wiNGsx01z8D6qDBUxbKLUBfXRo6EBzo2o" />\\n</head>#' index.html && npm install && npm run build'''
  publish = ".netlify-build/project/dist"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
